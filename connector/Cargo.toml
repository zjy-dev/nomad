[package]
name = "nomad-connector"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nomad-connector"
path = "src/main.rs"

[[bin]]
name = "process-bridge"
path = "src/bin/process_bridge.rs"

[[bin]]
name = "pilot-host-bridge"
path = "src/bin/pilot_host_bridge.rs"

[[bin]]
name = "pilot-adapter"
path = "src/bin/pilot_adapter.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
thiserror = "1"
ureq = "2"

[dev-dependencies]
tempfile = "3"
